# Dependabot version updates
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# PlatformIO libraries are not supported by Dependabot; they are handled by
# .github/workflows/dependabot.yml (peterus/platformio_dependabot).

version: 2
updates:
  # Frontend (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    # Wait longer than pnpm's minimumReleaseAge (1 day by default), so bumps
    # need no new minimumReleaseAgeExclude entries in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    groups:
      # One PR for all minor/patch bumps; majors stay separate PRs.
      frontend:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Root tooling: oxlint, oxfmt, semantic-release (pnpm)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      tooling:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python tooling (pyproject.toml / poetry.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      python:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"
