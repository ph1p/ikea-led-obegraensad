allowBuilds:
  esbuild: true
# Solid 2 packages released within pnpm's minimumReleaseAge window; drop once
# they are older than a day.
minimumReleaseAgeExclude:
  - solid-js@2.0.0
  - "@solidjs/signals@2.0.0"
  - "@solidjs/web@2.0.0"
  - "@solidjs/vite-plugin@3.0.0"
  - "@solid-primitives/event-listener@3.0.0"
  - "@solid-primitives/intersection-observer@3.0.0"
  - "@solid-primitives/utils@7.0.0"
  - "@solid-primitives/websocket@2.0.0"
  - "@solidjs/compiler-darwin-arm64@2.0.0"
  - "@solidjs/compiler-darwin-x64@2.0.0"
  - "@solidjs/compiler-linux-arm64-gnu@2.0.0"
  - "@solidjs/compiler-linux-x64-gnu@2.0.0"
  - "@solidjs/compiler-wasm32-wasi@2.0.0"
  - "@solidjs/compiler-win32-x64-msvc@2.0.0"
  - "@solidjs/compiler@2.0.0"
